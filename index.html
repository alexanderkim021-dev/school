<script>
let newWorker = null;
if ('serviceWorker' in navigator) {
  const SW_VERSION = 'v20.0';
  const swCode = `
    const C = 'school-offline-' + '${SW_VERSION}';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(C).then(c => c.addAll([location.href])));
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== C).map(k => caches.delete(k)))));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(res => res || fetch(e.request).catch(() => caches.match(location.href))));
    });
    self.addEventListener('message', e => {
      if (e.data === 'skipWaiting') self.skipWaiting();
    });
  `;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).then(reg => {
    reg.addEventListener('updatefound', () => {
      newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          const b = document.getElementById('updBanner');
          if (b) b.classList.add('show');
        }
      });
    });
  }).catch(()=>{});

  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) {
      refreshing = true;
      window.location.reload();
    }
  });
}

function applyAppUpdate(){
  if (newWorker) newWorker.postMessage('skipWaiting');
  else window.location.reload();
}

const $ = s => document.querySelector(s);
const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c]));

const MO = ['តុលា','វិច្ឆិកា','ធ្នូ','មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា'];

const KH_NUMS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
const toKhNum = n => String(n).split('').map(d => KH_NUMS[d] || d).join('');
const KH_MONTHS = ['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];

function smartKhmerDate(val){
  if (!val) return '';
  const s = String(val).trim();
  if (KH_MONTHS.some(m => s.includes(m))) return s;

  let d, m, y;
  const cleaned = s.replace(/[^0-9]/g, '');
  if (cleaned.length === 8) {
    d = parseInt(cleaned.substring(0, 2), 10);
    m = parseInt(cleaned.substring(2, 4), 10);
    y = parseInt(cleaned.substring(4, 8), 10);
  } else {
    const parts = s.split(/[-/.\s]+/);
    if (parts.length === 3) {
      if (parts[0].length === 4) { y = parseInt(parts[0], 10); m = parseInt(parts[1], 10); d = parseInt(parts[2], 10); }
      else { d = parseInt(parts[0], 10); m = parseInt(parts[1], 10); y = parseInt(parts[2], 10); }
    }
  }

  if (d > 0 && d <= 31 && m > 0 && m <= 12 && y > 1900 && y < 2100) {
    const dd = String(d).padStart(2, '0');
    return `${toKhNum(dd)} ${KH_MONTHS[m - 1]} ${toKhNum(y)}`;
  }
  return s;
}

const enc = new TextEncoder(), dec = new TextDecoder();
function b64(buf){
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function unb64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations: 200000, hash: 'SHA-256'},
    base, {name:'AES-GCM', length: 256}, false, ['encrypt','decrypt']);
}
async function seal(key, text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(text));
  return {iv: b64(iv), ct: b64(ct)};
}
async function open(key, box){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(box.iv)}, key, unb64(box.ct));
  return dec.decode(pt);
}

function readAccounts(){
  const raw = localStorage.getItem(ACCKEY);
  if (!raw) return {};
  try { return JSON.parse(raw); } catch (e) { return {}; }
}
let accounts = readAccounts();
function saveAccounts(){ localStorage.setItem(ACCKEY, JSON.stringify(accounts)); }

async function createAccount(u, pw, fullname){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pw, salt);
  accounts[u] = {fullname, salt: b64(salt), check: await seal(key, 'ok'), data: null, created: Date.now(), backupAt: 0};
  saveAccounts();
  return key;
}

async function unlock(u, pw){
  const acc = accounts[u];
  if (!acc) throw new Error('no-account');
  const key = await deriveKey(pw, unb64(acc.salt));
  let ok = false;
  try { ok = (await open(key, acc.check)) === 'ok'; } catch (e) { ok = false; }
  if (!ok) throw new Error('bad-password');
  return key;
}

let SESSION = null;
let currentYear = '២០២៥ - ២០២៦';
let currentLevel = 'secondary';
let allYearsData = {};

function emptyLevelData(lbl, yr){
  const isSec = lbl === 'អនុវិទ្យាល័យ' || lbl === 'វិទ្យាល័យ';
  const defaultDiv = isSec ? 16 : 7;
  return {
    v: 9, n: 1,
    info: {province:'', school:'', teacher:'', cls: isSec ? '៨A' : 'ថ្នាក់ទី ៦', year: yr || currentYear, div: defaultDiv, logo: null, moeysLogo: null},
    st: [], sc: {}, ab: {}, rm: {}
  };
}

function normalizeLevel(d, lbl, yr){
  const e = emptyLevelData(lbl, yr);
  if (!d || typeof d !== 'object') return e;
  const st = Array.isArray(d.st) ? d.st : [];
  return {
    ...e, ...d,
    info: {...e.info, ...(d.info || {})},
    st, sc: d.sc || {}, ab: d.ab || {}, rm: d.rm || {},
    n: Math.max(d.n || 1, ...st.map(s => (+s.id || 0) + 1), 1)
  };
}

function normalizeYearPackage(rawPkg, yr){
  if (!rawPkg || typeof rawPkg !== 'object') {
    return {
      primary: emptyLevelData('បឋមសិក្សា', yr),
      secondary: emptyLevelData('អនុវិទ្យាល័យ', yr),
      high: emptyLevelData('វិទ្យាល័យ', yr)
    };
  }
  return {
    primary: normalizeLevel(rawPkg.primary, 'បឋមសិក្សា', yr),
    secondary: normalizeLevel(rawPkg.secondary, 'អនុវិទ្យាល័យ', yr),
    high: normalizeLevel(rawPkg.high, 'វិទ្យាល័យ', yr)
  };
}

function normalizeAllYears(raw){
  const defYr = '២០២៥ - ២០២៦';
  if (!raw || typeof raw !== 'object') {
    const o = {}; o[defYr] = normalizeYearPackage(null, defYr); return o;
  }
  if (raw.primary || raw.secondary || raw.high) {
    const o = {}; o[defYr] = normalizeYearPackage(raw, defYr); return o;
  }
  const res = {};
  for (let y in raw) {
    res[y] = normalizeYearPackage(raw[y], y);
  }
  if (!Object.keys(res).length) res[defYr] = normalizeYearPackage(null, defYr);
  return res;
}

function getS(){
  if (!allYearsData[currentYear]) {
    allYearsData[currentYear] = normalizeYearPackage(null, currentYear);
  }
  return allYearsData[currentYear][currentLevel];
}

function setStatus(text, err){

function save(){
  if (!SESSION || !allYearsData) return;
  const key = SESSION.key, u = SESSION.username, snapshot = JSON.stringify(allYearsData);
  setStatus('កំពុងរក្សាទុក...');
  saveChain = saveChain.then(async () => {
    try {
      accounts[u].data = await seal(key, snapshot);
      saveAccounts();
      setStatus('បានរក្សាទុក ✓');
    } catch (e) {
      setStatus('រក្សាទុកមិនបាន: ' + e.message, true);
    }
  });
}

async function openSession(u, key){
  const acc = accounts[u];
  let parsed = null;
  try { parsed = acc.data ? JSON.parse(await open(key, acc.data)) : null; }
  catch (e) { alert('មិនអាចបើកទិន្នន័យបាន'); return; }
  allYearsData = normalizeAllYears(parsed);
  currentYear = Object.keys(allYearsData)[0] || '២០២៥ - ២០២៦';
  SESSION = {username: u, key, fullname: acc.fullname};
  pg = 'home';
  R();
  resetIdle();
}

async function logout(){
  await saveChain;
  SESSION = null; allYearsData = null;
  clearTimeout(idleT);
  pg = 'login';
  R();
}

function resetIdle(){
  clearTimeout(idleT);
  if (SESSION) idleT = setTimeout(() => { alert('បានចាកចេញស្វ័យប្រវត្តិ'); logout(); }, 20 * 60 * 1000);
}

function getGradeLetter(a, t){
  if (!t) return '-';
  if (a >= 45) return 'A';
  if (a >= 40) return 'B';
  if (a >= 35) return 'C';
  if (a >= 30) return 'D';
  if (a >= 25) return 'E';

function initDragAndDrop(){
  const grid = $('#btnGrid');
  if (!grid) return;
  let dragged = null;
  let touchTimer = null;
  let isTouchDragging = false;

  grid.querySelectorAll('.pb').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragged = el;
      el.classList.add('touch-dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      if (dragged) dragged.classList.remove('touch-dragging');
      dragged = null;
      saveNewOrder();
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragged || dragged === el) return;
      handlePlacement(el, e.clientX);
    });

    el.addEventListener('touchstart', e => {
      touchTimer = setTimeout(() => {
        isTouchDragging = true;
        dragged = el;
        el.classList.add('touch-dragging');
        if (navigator.vibrate) navigator.vibrate(50);
      }, 400);
    }, {passive: true});

    el.addEventListener('touchmove', e => {
      if (!isTouchDragging) { clearTimeout(touchTimer); return; }
      e.preventDefault();
      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetBtn = target ? target.closest('.pb') : null;
      if (targetBtn && targetBtn !== dragged && targetBtn.parentElement === grid) {
        handlePlacement(targetBtn, touch.clientX);
      }
    }, {passive: false});

    el.addEventListener('touchend', () => {
      clearTimeout(touchTimer);
      if (isTouchDragging) {
        isTouchDragging = false;
        if (dragged) dragged.classList.remove('touch-dragging');
        dragged = null;
        saveNewOrder();
      }
    });
  });

  function handlePlacement(targetBtn, clientX){
    const rect = targetBtn.getBoundingClientRect();
    const mid = rect.left + rect.width / 2;
    if (clientX < mid) {
      grid.insertBefore(dragged, targetBtn);
    } else {
      grid.insertBefore(dragged, targetBtn.nextSibling);
    }
  }

  function saveNewOrder(){
    const newOrder = [...grid.querySelectorAll('.pb')].map(b => b.dataset.id);
    localStorage.setItem(ORDER_KEY, JSON.stringify(newOrder));
  }
}

function pick(cb){
  const f = document.createElement('input');
  f.type = 'file'; f.accept = 'image/*'; f.style.display = 'none';
  document.body.appendChild(f);
  f.onchange = () => {
    const fl = f.files[0]; f.remove();
    if (!fl) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 160 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(im, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', .75));
      };
      im.src = r.result;
    };
    r.readAsDataURL(fl);
  };
  f.click();
}

}
function reset(){
  const levelNames = { primary: 'បឋមសិក្សា', secondary: 'អនុវិទ្យាល័យ', high: 'វិទ្យាល័យ' };
  if (!confirm(`លុបទិន្នន័យកម្រិត ${levelNames[currentLevel]} នៃឆ្នាំសិក្សា ${currentYear} ទាំងអស់?`)) return;
  const i = getS().info;
  allYearsData[currentYear][currentLevel] = {...emptyLevelData(levelNames[currentLevel], currentYear), info: i};
  save(); go('home');
}

function backupFileName(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `backup-គ្រប់គ្រងសាលា-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
}
async function makePkgBlob(){
  save();
  await saveChain;
  const acc = accounts[SESSION.username];
  return new Blob([JSON.stringify({
    app: 'school-offline', version: 9,
    username: SESSION.username, fullname: acc.fullname,
    salt: acc.salt, check: acc.check, data: acc.data, created: acc.created
  })], {type: 'application/json'});
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function exportData(){ downloadBlob(await makePkgBlob(), backupFileName()); R(); }
async function shareBackup(){
  const blob = await makePkgBlob();
  const file = new File([blob], backupFileName(), {type: 'application/json'});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: 'Backup ថ្នាក់រៀន'}); } catch (e) {}
  } else { downloadBlob(blob, backupFileName()); }
  R();
}
function importFile(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let p;
    try { p = JSON.parse(r.result); } catch (e) { return alert('ឯកសារមិនត្រឹមត្រូវ'); }
    if (!p || p.app !== 'school-offline') return alert('ឯកសារមិនមែនជា Backup');
    const u = String(p.username).toLowerCase();
    accounts[u] = {fullname: p.fullname, salt: p.salt, check: p.check, data: p.data, created: p.created || Date.now(), backupAt: Date.now()};
    saveAccounts();
    showLogin(`បាននាំចូលគណនី ${u} ជោគជ័យ`);
  };
  r.readAsText(file);
}

R();
